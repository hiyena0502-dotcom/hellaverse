name: Hellaverse Smoke

on:
  push:
    branches: ["main", "chatgpt/**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Run large-project smoke test
        run: node tests/smoke.mjs
