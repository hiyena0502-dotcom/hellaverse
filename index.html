<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#0b080a" />
  <meta name="hellaverse-build" content="93" />
  <title>Hellaverse</title>
  <link rel="stylesheet" href="css/base.css?v=93" />
  <link rel="stylesheet" href="css/world.css?v=93" />
  <link rel="stylesheet" href="css/world-regions.css?v=93" />
  <link rel="stylesheet" href="css/dialogue.css?v=93" />
  <link rel="stylesheet" href="css/gacha.css?v=93" />
  <link rel="stylesheet" href="css/thoughts.css?v=93" />
  <link rel="stylesheet" href="css/collection.css?v=93" />
  <link rel="stylesheet" href="css/editor.css?v=93" />
  <link rel="stylesheet" href="css/features.css?v=93" />
</head>
<body>
  <section id="startScreen" class="title-screen">
    <form id="startForm" class="title-panel">
      <p class="title-kicker">HELLAVERSE</p>
      <h1>ENTER THE LOBBY</h1>
      <p class="title-sub">이름과 출신을 정한 뒤 대화할 캐릭터를 선택합니다.</p>

      <label class="start-field">
        <span>NAME</span>
        <input id="playerNameInput" type="text" maxlength="24" placeholder="이름을 입력하세요" autocomplete="off" />
      </label>

      <div class="start-field">
        <span>ORIGIN</span>
        <div class="origin-groups" id="originChoice">
          <section class="origin-group">
            <div class="origin-group-head"><strong>지옥 출신</strong><small>HELL</small></div>
            <div class="origin-choice">
              <button type="button" data-origin="sinner"><b>죄인</b><small>SINNER</small></button>
              <button type="button" data-origin="hellborn"><b>헬본</b><small>HELLBORN</small></button>
            </div>
          </section>
          <section class="origin-group">
            <div class="origin-group-head"><strong>천국 출신</strong><small>HEAVEN</small></div>
            <div class="origin-choice">
              <button type="button" data-origin="angel"><b>천사</b><small>ANGEL</small></button>
              <button type="button" data-origin="winner"><b>위너</b><small>WINNER</small></button>
            </div>
          </section>
        </div>
      </div>

      <button id="enterGameButton" class="title-enter" type="submit">ENTER</button>
      <button id="startImportButton" class="start-import-button" type="button" hidden>기존 JSON 불러오기</button>
      <p id="startHint" class="title-hint" role="status" aria-live="polite">이름과 출신을 선택하세요.</p>
    </form>
  </section>

  <div id="gameShell" class="site-shell" hidden>
    <header class="game-hud">
      <button id="brandButton" class="brand-mark" type="button">HELLAVERSE</button>
      <nav class="main-nav" aria-label="주요 메뉴">
        <button class="nav-button active" type="button" data-page="home">HOME</button>
        <button class="nav-button" type="button" data-page="characters">CHARACTERS</button>
        <button class="nav-button" type="button" data-page="gacha">GACHA</button>
        <button class="nav-button" type="button" data-page="thought">THOUGHT</button>
        <button class="nav-button" type="button" data-page="collection">COLLECTION</button>
      </nav>
      <button class="nav-button world-entry-button" type="button" data-page="world" aria-label="WORLD 열기">
        <span class="world-entry-glyph" aria-hidden="true">✦</span>
        <span class="world-entry-copy"><b>WORLD</b><small>MAP</small></span>
      </button>
      <div class="hud-tools">
        <span id="saveStatus" class="save-status" data-status="saved" role="status" aria-live="polite">SAVED</span>
        <span id="playerBadge" class="player-badge"></span>
        <button id="dataButton" class="text-link" type="button">DATA</button>
        <button id="editorButton" class="text-link" type="button">EDITOR</button>
        <button id="changeProfileButton" class="text-link" type="button">PROFILE</button>
      </div>
    </header>
    <button id="updateBanner" class="update-banner" type="button" hidden>새 버전이 있습니다 · 새로고침</button>

    <main id="pageRoot" class="page-root"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="editorOverlay" class="editor-overlay" hidden>
    <section class="editor-shell" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="editor-topbar">
        <div>
          <p class="label">MANAGEMENT</p>
          <h1 id="editorTitle">EDITOR</h1>
        </div>
        <div class="editor-top-actions">
          <button id="editorUndoButton" class="ghost-button" type="button" disabled>UNDO</button>
          <button id="editorRedoButton" class="ghost-button" type="button" disabled>REDO</button>
          <button id="editorRestoreButton" class="ghost-button" type="button">RESTORE</button>
          <button id="editorCheckButton" class="ghost-button" type="button">CHECK</button>
          <button id="editorCancelButton" class="ghost-button" type="button">취소</button>
          <button id="editorSaveButton" class="gold-button" type="button">모두 저장</button>
        </div>
      </header>

      <div class="editor-workspace">
        <aside class="editor-sidebar">
          <button type="button" class="editor-nav active" data-editor-tab="dialogue">
            <span>01</span><strong>대화 이벤트</strong><small>캐릭터 · 이벤트 · 선택지</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="ask">
            <span>02</span><strong>ASK 설정</strong><small>질문 · 연결 이벤트</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="item">
            <span>03</span><strong>아이템 설정</strong><small>캐릭터별 아이템 · 인벤토리</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="gacha">
            <span>04</span><strong>가챠 설정</strong><small>비용 · 확률 · 아이템 풀</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="thought">
            <span>05</span><strong>THOUGHT 설정</strong><small>카테고리 · 빈도 · 문장</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="collection">
            <span>06</span><strong>컬렉션 설정</strong><small>캐릭터별 아카이브 표시</small>
          </button>
          <button type="button" class="editor-nav" data-editor-tab="character-image">
            <span>07</span><strong>캐릭터 이미지</strong><small>감정별 이미지 · 크기</small>
          </button>
        </aside>

        <section id="editorBody" class="editor-body"></section>
      </div>
    </section>
  </div>

  <script src="data/default-content.js?v=93"></script>
  <script src="data/story-packs.js?v=93"></script>
  <script src="data/character-events.js?v=93"></script>
  <script src="data/topic-pool-500.js?v=93"></script>
  <script src="data/character-topic-talks-52.js?v=93"></script>
  <script src="data/lucifer-talk-13-30.js?v=93"></script>
  <script src="data/lucifer-talk-31-60.js?v=93"></script>
  <script src="data/unified-character-content.js?v=93"></script>
  <script src="data/lucifer-talk-61-64.js?v=93"></script>
  <script src="data/lucifer-talk-65-67.js?v=93"></script>
  <script src="data/lucifer-talk-68-70.js?v=93"></script>
  <script src="data/origin-intros.js?v=93"></script>
  <script src="data/item-presets.js?v=93"></script>
  <script src="data/dialogue-presets.js?v=93"></script>
  <script src="data/world-config.js?v=93"></script>
  <script src="data/gacha-profiles.js?v=93"></script>
  <script src="data/archive-meta-1.js?v=93"></script>
  <script src="data/archive-meta-2.js?v=93"></script>
  <script src="data/archive-meta-3.js?v=93"></script>
  <script src="data/archive-meta-4.js?v=93"></script>
  <script src="data/archive-meta-5.js?v=93"></script>
  <script src="js/core/state.js?v=93"></script>
  <script src="js/core/game-state.js?v=93"></script>
  <script src="js/ui/app-shell.js?v=93"></script>
  <script src="js/world/hotel.js?v=93"></script>
  <script src="js/world/regions.js?v=93"></script>
  <script src="js/game/dialogue.js?v=93"></script>
  <script src="js/editor/editor-ui.js?v=93"></script>
  <script src="js/editor/editor-events.js?v=93"></script>
</body>
</html>
